<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aardvark Playlist</title>
  <link rel="stylesheet" href="css/youTubePlayer.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .aardvark-boot-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #161b22 0%, #0d1117 75%);
      gap: 16px;
      user-select: none;
    }
    .boot-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: bootSpin 0.8s linear infinite;
    }
    @keyframes bootSpin {
      to { transform: rotate(360deg); }
    }
    .boot-title {
      font-size: 19px;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: -0.3px;
    }
    .boot-status {
      font-size: 13px;
      color: #7d8590;
      max-width: 80%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <script src="/Library/LunoLoader.js" onerror="this.onerror=null; (function(el){ var u=(window.location.hostname.endsWith('.github.io')?window.location.hostname.split('.')[0]:'karmatics'); el.src='https://'+u+'.github.io/Library/LunoLoader.js'; el.onerror=function(){ el.onerror=null; el.src='https://karmatics.github.io/Library/LunoLoader.js'; }; })(this);"></script>
</head>
<body>
  <div id="app-container">
    <div class="aardvark-boot-loader">
      <div class="boot-spinner"></div>
      <div class="boot-title">Aardvark Playlist</div>
      <div class="boot-status" id="aardvark-boot-msg">Starting music engine...</div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof LunoLoader !== "undefined") {
        LunoLoader.loadApp("app-container");
      }
    });
  </script>
</body>
</html>
